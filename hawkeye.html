<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HawkEye - Offline File Versioning System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      background: #0b1220;
      color: #d5dbe6;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    #site-header {
      text-align: center;
      padding: 20px 20px 20px;
      flex-shrink: 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 700;
    }

    .brand-logo { color: #22d3c5; font-size: 22px; }

    .brand-name {
      background: linear-gradient(90deg, #22d3c5, #7c6cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 4px;
      color: #6b7a90;
    }

    #main-nav {
      display: flex;
      justify-content: center;
      width: max-content;
      margin: 18px auto 0;
      border-bottom: 1px solid #1c2740;
    }

    .nav-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      font-size: 13px;
      color: #8a97ad;
      text-decoration: none;
      border: 1px solid #1c2740;
      border-bottom: none;
      background: #0f1729;
    }

    .nav-tab + .nav-tab { border-left: none; }

    .nav-tab.active {
      color: #fff;
      background: #0b1220;
      border-bottom: 2px solid #22d3c5;
      margin-bottom: -1px;
    }

    #main-content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .view[hidden] { display: none; }

    .workspace-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 220px 280px minmax(0, 1fr) 250px;
      border-top: 1px solid #1c2740;
    }

    @media (max-width: 1180px) {
      .workspace-grid { grid-template-columns: 190px 240px minmax(0, 1fr) 210px; }
    }

    @media (max-width: 900px) {
      .workspace-grid { grid-template-columns: 180px 220px minmax(0, 1fr); }
      .workspace-grid #versions-pane { display: none; }
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: #0d1526;
      border-right: 1px solid #1c2740;
    }

    .pane:last-child { border-right: none; }

    .pane-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8a97ad;
      border-bottom: 1px solid #1c2740;
      flex-shrink: 0;
    }

    .pane-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    /* No horizontal scrolling in Explorer and View Changes */
    #explorer-body,
    #changes-body {
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-color: #9d9d9d #191919;
    }

    /* Dark track, gray pill thumb, arrow buttons (matches reference image) */
    #explorer-body::-webkit-scrollbar,
    #changes-body::-webkit-scrollbar {
      width: 12px;
      height: 0;
    }

    #explorer-body::-webkit-scrollbar-track,
    #changes-body::-webkit-scrollbar-track {
      background: #191919;
    }

    #explorer-body::-webkit-scrollbar-thumb,
    #changes-body::-webkit-scrollbar-thumb {
      background: #9d9d9d;
      border: 2px solid #191919;
      border-radius: 6px;
    }

    #explorer-body::-webkit-scrollbar-thumb:hover,
    #changes-body::-webkit-scrollbar-thumb:hover {
      background: #b8b8b8;
    }

    #explorer-body::-webkit-scrollbar-button:horizontal,
    #changes-body::-webkit-scrollbar-button:horizontal {
      display: none;
    }

    #explorer-body::-webkit-scrollbar-button:vertical,
    #changes-body::-webkit-scrollbar-button:vertical {
      height: 14px;
      background-color: #191919;
      background-repeat: no-repeat;
      background-position: center;
      background-size: 10px 6px;
    }

    #explorer-body::-webkit-scrollbar-button:vertical:decrement,
    #changes-body::-webkit-scrollbar-button:vertical:decrement {
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='6'%3E%3Cpath%20d='M5%200L10%206H0Z'%20fill='%23c9c9c9'/%3E%3C/svg%3E");
    }

    #explorer-body::-webkit-scrollbar-button:vertical:increment,
    #changes-body::-webkit-scrollbar-button:vertical:increment {
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='6'%3E%3Cpath%20d='M0%200H10L5%206Z'%20fill='%23c9c9c9'/%3E%3C/svg%3E");
    }

    .pane-foot {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #1c2740;
      flex-shrink: 0;
    }

    button {
      font-family: inherit;
      font-size: 12px;
      color: #b9c3d4;
      background: #131d33;
      border: 1px solid #253253;
      border-radius: 6px;
      padding: 7px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover:not(:disabled) {
      background: #1a2843;
      color: #fff;
      border-color: #33436b;
    }

    button:disabled { opacity: .45; cursor: not-allowed; }

    .pane-foot button { flex: 1; }

    .ws-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      list-style: none;
      padding: 6px;
    }

    .ws-empty-item {
      padding: 24px 10px;
      text-align: center;
      font-size: 12px;
      color: #55637d;
    }

    .ws-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: #b9c3d4;
      cursor: pointer;
    }

    .ws-item:hover { background: #131d33; }
    .ws-item.active { background: #16233c; color: #fff; }

    .ws-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid #4a5670;
      flex-shrink: 0;
    }

    .ws-item.active .ws-dot {
      background: #22d3c5;
      border-color: #22d3c5;
    }

    .ws-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ws-count { font-size: 11px; color: #6b7a90; }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      font-size: 12.5px;
      color: #b9c3d4;
      cursor: pointer;
      white-space: nowrap;
    }

    .tree-row:hover { background: #131d33; }
    .tree-row.file.selected { background: #1a2b46; color: #fff; }

    .tree-row i { font-size: 12px; color: #6b7a90; flex-shrink: 0; }
    .tree-row.dir i.fa-folder,
    .tree-row.dir i.fa-folder-open { color: #e0b341; }

    .tree-row .tree-name { overflow: hidden; text-overflow: ellipsis; }

    .caret { width: 10px; }
    .caret-spacer { width: 10px; display: inline-block; }

    .tree-group-head {
      padding: 8px 10px 4px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #55637d;
    }

    .changes-head {
      display: block;
      text-transform: none;
      letter-spacing: 0;
    }

    .changes-file {
      font-size: 13px;
      font-weight: 600;
      color: #e6ecf6;
    }

    .changes-meta {
      font-size: 11px;
      color: #6b7a90;
      margin-top: 3px;
      word-break: break-all;
    }

    .changes-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffd28a;
      background: #3a2c14;
      border: 1px solid #5c451f;
      border-radius: 999px;
    }

    .changes-badge.is-current {
      color: #8ef0e4;
      background: #10312f;
      border-color: #1d4c47;
    }

    .versions-head-count {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .5px;
      color: #6b7a90;
      text-transform: none;
    }

    .ver-list { list-style: none; padding: 6px; }

    .ver-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .ver-item:hover { background: #131d33; }
    .ver-item.active { background: #16233c; }

    .ver-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding-top: 3px;
    }

    .ver-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid #4a5670;
      background: #0d1526;
    }

    .ver-item.active .ver-dot {
      background: #22d3c5;
      border-color: #22d3c5;
    }

    .ver-item.current .ver-dot {
      background: #7c6cf6;
      border-color: #7c6cf6;
    }

    .ver-line {
      width: 1px;
      flex: 1;
      min-height: 16px;
      background: #1c2740;
    }

    .ver-body { min-width: 0; flex: 1; }

    .ver-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: #cfd8e6;
    }

    .ver-item.active .ver-title { color: #fff; }

    .ver-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7c6cf6;
      background: #1b1836;
      border: 1px solid #332d61;
      border-radius: 999px;
      padding: 1px 6px;
    }

    .ver-meta {
      margin-top: 3px;
      font-size: 11px;
      color: #6b7a90;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100%;
      padding: 30px 20px;
      text-align: center;
      color: #6b7a90;
    }

    .empty-state i { font-size: 26px; color: #2c3a55; }
    .empty-state .empty-title { font-size: 13px; color: #8a97ad; }
    .empty-state p { font-size: 12.5px; max-width: 230px; line-height: 1.5; }

    .code-view {
      font-family: "Cascadia Mono", Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.5;
      min-width: 0;
    }

    .code-line { display: flex; }

    .code-line .ln {
      width: 46px;
      flex-shrink: 0;
      text-align: right;
      padding-right: 12px;
      color: #3f4d66;
      user-select: none;
    }

    .code-line .lc { white-space: pre-wrap; word-break: break-word; color: #cfd8e6; }
    .code-line:hover { background: #101a2e; }

    .trunc-note {
      padding: 10px 14px;
      font-size: 11px;
      color: #6b7a90;
      border-top: 1px solid #1c2740;
    }

    .placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #55637d;
      font-size: 13px;
    }

    .placeholder i { font-size: 30px; color: #2c3a55; }
  </style>
</head>
<body>
  <header id="site-header">
    <h1 class="brand">
      <i class="fa-solid fa-crow brand-logo"></i>
      <span class="brand-name">HawkEye</span>
    </h1>
    <p class="tagline">OFFLINE FILE VERSIONING SYSTEM</p>

    <nav id="main-nav">
      <a href="#home" class="nav-tab active" data-view="home"><i class="fa-solid fa-house"></i> Home</a>
      <a href="#dashboard" class="nav-tab" data-view="dashboard"><i class="fa-solid fa-table-cells"></i> Dashboard</a>
      <a href="#timeline" class="nav-tab" data-view="timeline"><i class="fa-solid fa-clock-rotate-left"></i> Timeline</a>
    </nav>
  </header>

  <main id="main-content">
    <section class="view workspace-grid" data-view="home">
      <section class="pane" id="ws-pane">
        <header class="pane-head">Workspaces</header>
        <ul class="ws-list" id="ws-list"></ul>
        <footer class="pane-foot">
          <button id="btn-add-ws"><i class="fa-solid fa-plus"></i> Add</button>
          <button id="btn-all-ws" disabled><i class="fa-solid fa-arrow-right"></i> All</button>
        </footer>
      </section>

      <section class="pane" id="explorer-pane">
        <header class="pane-head" id="explorer-title">Explorer</header>
        <div class="pane-body" id="explorer-body"></div>
      </section>

      <section class="pane" id="changes-pane">
        <header class="pane-head changes-head">
          <div class="changes-file" id="changes-file">No file selected</div>
          <div class="changes-meta" id="changes-meta"></div>
          <span class="changes-badge is-current" id="changes-badge" hidden></span>
        </header>
        <div class="pane-body" id="changes-body"></div>
      </section>

      <section class="pane" id="versions-pane">
        <header class="pane-head">
          <i class="fa-solid fa-layer-group"></i> Old Versions
          <span class="versions-head-count" id="versions-count"></span>
        </header>
        <div class="pane-body" id="versions-body"></div>
      </section>
    </section>

    <section class="view placeholder" data-view="dashboard" hidden>
      <i class="fa-solid fa-table-cells"></i>
      <p>Dashboard coming soon</p>
    </section>

    <section class="view placeholder" data-view="timeline" hidden>
      <i class="fa-solid fa-clock-rotate-left"></i>
      <p>Timeline coming soon</p>
    </section>
  </main>

  <input type="file" id="dir-input" webkitdirectory directory multiple hidden>

  <script>
    (function () {
      'use strict';

      var MAX_PREVIEW_BYTES = 256 * 1024;
      var MAX_STORED_BYTES = 2 * 1024 * 1024;
      var MAX_VERSIONS_PER_FILE = 50;
      var INDENT = 14;

      var state = {
        workspaces: [],
        activeId: null,
        seq: 0,
        // path -> [oldest..newest]
        versionsByPath: {},
        activePath: null,   // file currently shown
        activeIndex: -1     // index into versionsByPath[activePath].versions
      };

      var selectToken = 0;

      var EXT_ICONS = {
        py: 'fa-brands fa-python',
        js: 'fa-brands fa-js',
        mjs: 'fa-brands fa-js',
        cjs: 'fa-brands fa-js',
        ts: 'fa-solid fa-file-code',
        jsx: 'fa-brands fa-react',
        tsx: 'fa-brands fa-react',
        html: 'fa-brands fa-html5',
        htm: 'fa-brands fa-html5',
        css: 'fa-brands fa-css3-alt',
        scss: 'fa-brands fa-sass',
        sass: 'fa-brands fa-sass',
        json: 'fa-solid fa-file-code',
        md: 'fa-brands fa-markdown',
        txt: 'fa-solid fa-file-lines',
        log: 'fa-solid fa-file-lines',
        sql: 'fa-solid fa-database',
        db: 'fa-solid fa-database',
        sqlite: 'fa-solid fa-database',
        png: 'fa-solid fa-file-image',
        jpg: 'fa-solid fa-file-image',
        jpeg: 'fa-solid fa-file-image',
        gif: 'fa-solid fa-file-image',
        svg: 'fa-solid fa-file-image',
        webp: 'fa-solid fa-file-image',
        ico: 'fa-solid fa-file-image',
        pdf: 'fa-solid fa-file-pdf',
        csv: 'fa-solid fa-file-csv',
        zip: 'fa-solid fa-file-zipper',
        gz: 'fa-solid fa-file-zipper',
        tar: 'fa-solid fa-file-zipper',
        bat: 'fa-solid fa-terminal',
        ps1: 'fa-solid fa-terminal',
        sh: 'fa-solid fa-terminal',
        cmd: 'fa-solid fa-terminal',
        yml: 'fa-solid fa-gear',
        yaml: 'fa-solid fa-gear',
        toml: 'fa-solid fa-gear',
        ini: 'fa-solid fa-gear',
        env: 'fa-solid fa-gear'
      };

      function $(sel) { return document.querySelector(sel); }

      function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text != null) node.textContent = text;
        return node;
      }

      function iconFor(name) {
        var ext = name.split('.').pop().toLowerCase();
        return EXT_ICONS[ext] || 'fa-solid fa-file';
      }

      function fmtSize(bytes) {
        if (bytes == null) return '';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      }

      function fmtDate(ms) {
        if (!ms) return 'unknown';
        return new Date(ms).toLocaleDateString(undefined, {
          month: 'short', day: 'numeric', year: 'numeric'
        });
      }

      function fmtTime(ms) {
        if (!ms) return '';
        return new Date(ms).toLocaleTimeString(undefined, {
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      }

      // Non-crypto fingerprint used to detect whether the content really changed.
      function hashText(text) {
        var h1 = 0x811c9dc5, h2 = 0x1000193;
        var n = text.length;
        var step = n > 200000 ? Math.ceil(n / 100000) : 1;
        for (var i = 0; i < n; i += step) {
          var c = text.charCodeAt(i);
          h1 = (h1 ^ c) >>> 0;
          h1 = (h1 + ((h1 << 1) + (h1 << 4) + (h1 << 7) + (h1 << 8) + (h1 << 24))) >>> 0;
          h2 = (h2 * 31 + c) >>> 0;
        }
        return h1.toString(16) + '-' + h2.toString(16) + '-' + n;
      }

      function countFiles(node) {
        if (node.kind === 'file') return 1;
        return (node.children || []).reduce(function (n, c) { return n + countFiles(c); }, 0);
      }

      function sortNodes(nodes) {
        nodes.sort(function (a, b) {
          if (a.kind === b.kind) return a.name.localeCompare(b.name);
          return a.kind === 'dir' ? -1 : 1;
        });
      }

      function sortTree(node) {
        if (!node.children) return;
        sortNodes(node.children);
        node.children.forEach(sortTree);
      }

      function emptyState(icon, title, msg, btnLabel, onClick) {
        var wrap = el('div', 'empty-state');
        wrap.appendChild(el('i', 'fa-solid ' + icon));
        wrap.appendChild(el('p', 'empty-title', title));
        if (msg) wrap.appendChild(el('p', null, msg));
        if (btnLabel && onClick) {
          var btn = el('button');
          btn.appendChild(el('i', 'fa-solid fa-plus'));
          btn.appendChild(document.createTextNode(' ' + btnLabel));
          btn.addEventListener('click', onClick);
          wrap.appendChild(btn);
        }
        return wrap;
      }

      async function loadDirChildren(node) {
        if (node.loaded || !node.handle) return;
        var entries = [];
        for await (var entry of node.handle.values()) entries.push(entry);

        entries.sort(function (a, b) {
          if (a.kind === b.kind) return a.name.localeCompare(b.name);
          return a.kind === 'directory' ? -1 : 1;
        });

        for (var i = 0; i < entries.length; i++) {
          var e = entries[i];
          if (e.name.charAt(0) === '.') continue;
          var childPath = node.path + '/' + e.name;
          if (e.kind === 'directory') {
            node.children.push({
              name: e.name, kind: 'dir', path: childPath,
              children: [], handle: e, loaded: false
            });
          } else {
            node.children.push({
              name: e.name, kind: 'file', path: childPath, handle: e
            });
          }
        }
        node.loaded = true;
      }

      function treeFromFiles(files) {
        var first = files[0];
        var firstPath = first.webkitRelativePath || first.name;
        var rootName = firstPath.indexOf('/') !== -1 ? firstPath.split('/')[0] : 'Workspace';

        var root = {
          name: rootName, kind: 'dir', path: rootName,
          children: [], loaded: true
        };

        for (var i = 0; i < files.length; i++) {
          var file = files[i];
          var rel = file.webkitRelativePath || file.name;
          var parts = rel.split('/').filter(Boolean);
          if (parts.length && parts[0] === rootName) parts.shift();
          if (!parts.length) continue;

          var cur = root;
          for (var j = 0; j < parts.length; j++) {
            var part = parts[j];
            var last = j === parts.length - 1;
            var childPath = cur.path + '/' + part;

            if (last) {
              cur.children.push({ name: part, kind: 'file', path: childPath, file: file });
            } else {
              var next = null;
              for (var k = 0; k < cur.children.length; k++) {
                if (cur.children[k].kind === 'dir' && cur.children[k].name === part) {
                  next = cur.children[k];
                  break;
                }
              }
              if (!next) {
                next = {
                  name: part, kind: 'dir', path: childPath,
                  children: [], loaded: true
                };
                cur.children.push(next);
              }
              cur = next;
            }
          }
        }

        sortTree(root);
        return root;
      }

      async function addWorkspace() {
        if (typeof window.showDirectoryPicker === 'function') {
          var handle = null;
          try {
            handle = await window.showDirectoryPicker({ mode: 'read' });
          } catch (err) {
            if (err && err.name === 'AbortError') return;
            handle = null;
          }
          if (handle) {
            commitWorkspace({
              name: handle.name, kind: 'dir', path: handle.name,
              children: [], handle: handle, loaded: false
            });
            return;
          }
        }

        var input = $('#dir-input');
        input.value = '';
        input.click();
      }

      function commitWorkspace(tree) {
        state.seq += 1;
        var ws = { id: 'ws-' + state.seq, name: tree.name, tree: tree };
        state.workspaces.push(ws);
        state.activeId = ws.id;
        state.activePath = null;
        state.activeIndex = -1;
        renderWorkspaces();
        renderExplorer();
        renderChangesEmpty('Select a file to view its contents');
        renderVersionsEmpty('Select a file to capture its versions');
      }

      function renderWorkspaces() {
        var list = $('#ws-list');
        list.innerHTML = '';

        if (!state.workspaces.length) {
          list.appendChild(el('li', 'ws-empty-item', 'No workspaces yet'));
        }

        state.workspaces.forEach(function (ws) {
          var li = el('li', 'ws-item' + (ws.id === state.activeId ? ' active' : ''));
          li.appendChild(el('span', 'ws-dot'));
          li.appendChild(el('span', 'ws-name', ws.name));
          li.appendChild(el('span', 'ws-count', String(countFiles(ws.tree))));
          li.title = ws.name;
          li.addEventListener('click', function () {
            if (state.activeId === ws.id) return;
            state.activeId = ws.id;
            state.activePath = null;
            state.activeIndex = -1;
            renderWorkspaces();
            renderExplorer();
            renderChangesEmpty('Select a file to view its contents');
            renderVersionsEmpty('Select a file to capture its versions');
          });
          list.appendChild(li);
        });

        $('#btn-all-ws').disabled = state.workspaces.length === 0;
      }

      function createTreeEl(node, depth) {
        var wrap = el('div');
        var row = el('div', 'tree-row ' + (node.kind === 'dir' ? 'dir' : 'file'));
        row.style.paddingLeft = (depth * INDENT + 8) + 'px';

        if (node.kind === 'dir') {
          var caret = el('i', 'fa-solid fa-caret-right caret');
          var folderIcon = el('i', 'fa-solid fa-folder');
          row.appendChild(caret);
          row.appendChild(folderIcon);
          row.appendChild(el('span', 'tree-name', node.name));
          row.title = node.path;

          var kids = el('div');
          kids.hidden = true;
          var built = false;

          row.addEventListener('click', async function () {
            if (!built) {
              if (node.handle && !node.loaded) {
                try { await loadDirChildren(node); } catch (err) { /* ignore */ }
              }
              for (var i = 0; i < node.children.length; i++) {
                kids.appendChild(createTreeEl(node.children[i], depth + 1));
              }
              built = true;
            }
            kids.hidden = !kids.hidden;
            var open = !kids.hidden;
            caret.className = 'fa-solid ' + (open ? 'fa-caret-down' : 'fa-caret-right') + ' caret';
            folderIcon.className = 'fa-solid ' + (open ? 'fa-folder-open' : 'fa-folder');
          });

          wrap.appendChild(row);
          wrap.appendChild(kids);
        } else {
          row.appendChild(el('span', 'caret-spacer'));
          row.appendChild(el('i', iconFor(node.name)));
          row.appendChild(el('span', 'tree-name', node.name));
          row.title = node.path;
          if (state.activePath === node.path) row.classList.add('selected');
          row.addEventListener('click', function () { selectFile(node, row); });
          wrap.appendChild(row);
        }

        return wrap;
      }

      function renderExplorer() {
        var body = $('#explorer-body');
        var title = $('#explorer-title');
        body.innerHTML = '';

        if (!state.workspaces.length) {
          title.textContent = 'Explorer';
          body.appendChild(emptyState(
            'fa-folder-plus',
            'No workspace open',
            'Add a folder to browse its files and folders.',
            'Add Workspace',
            addWorkspace
          ));
          return;
        }

        if (state.activeId === '__all__') {
          title.textContent = 'All Workspaces';
          state.workspaces.forEach(function (ws) {
            var group = el('div');
            group.appendChild(el('div', 'tree-group-head', ws.name));
            group.appendChild(createTreeEl(ws.tree, 0));
            body.appendChild(group);
          });
          return;
        }

        var active = null;
        for (var i = 0; i < state.workspaces.length; i++) {
          if (state.workspaces[i].id === state.activeId) { active = state.workspaces[i]; break; }
        }
        if (!active) return;

        title.textContent = active.name;
        body.appendChild(createTreeEl(active.tree, 0));
      }

      async function readFile(node) {
        if (node.handle && typeof node.handle.getFile === 'function') {
          return await node.handle.getFile();
        }
        if (node.file) return node.file;
        throw new Error('No file source available');
      }

      function looksBinary(text) {
        return text.slice(0, 2000).indexOf('\u0000') !== -1;
      }

      /* ------------------------------------------------------------------ *
       * Version store
       * ------------------------------------------------------------------ */

      // Records a snapshot for a file. Only creates a new version when the
      // content fingerprint differs from the newest stored one.
      function captureVersion(node, file, text) {
        if (looksBinary(text)) return null;

        var versions = state.versionsByPath[node.path];
        if (!versions) {
          versions = [];
          state.versionsByPath[node.path] = versions;
        }

        var hash = hashText(text);
        var last = versions[versions.length - 1];
        if (last && last.hash === hash) return last;

        var truncated = text.length > MAX_STORED_BYTES;
        var version = {
          capturedAt: Date.now(),
          size: file ? file.size : text.length,
          lastModified: file ? file.lastModified : 0,
          hash: hash,
          text: truncated ? text.slice(0, MAX_STORED_BYTES) : text,
          truncated: truncated
        };

        versions.push(version);
        if (versions.length > MAX_VERSIONS_PER_FILE) versions.shift();
        return version;
      }

      function versionsFor(path) {
        return state.versionsByPath[path] || [];
      }

      function showVersion(path, index) {
        var versions = versionsFor(path);
        if (!versions.length) return;

        var clamped = Math.max(0, Math.min(index, versions.length - 1));
        state.activePath = path;
        state.activeIndex = clamped;

        var v = versions[clamped];
        var isLatest = clamped === versions.length - 1;
        renderChanges(
          { name: v.name, path: path, size: v.size, lastModified: v.lastModified },
          v.text,
          {
            isLatest: isLatest,
            label: isLatest ? 'Current version'
              : 'Viewing version ' + (clamped + 1) + ' of ' + versions.length,
            capturedAt: v.capturedAt,
            truncated: v.truncated
          }
        );
        renderVersions();
      }

      function stepVersion(delta) {
        var versions = versionsFor(state.activePath);
        if (!versions.length) return;
        var next = state.activeIndex + delta;
        if (next < 0 || next > versions.length - 1) return;
        showVersion(state.activePath, next);
      }

      function renderChangesEmpty(msg) {
        $('#changes-file').textContent = 'No file selected';
        $('#changes-meta').textContent = '';
        var badge = $('#changes-badge');
        badge.hidden = true;
        badge.textContent = '';
        var body = $('#changes-body');
        body.innerHTML = '';
        body.appendChild(emptyState('fa-code', 'View Changes', msg || 'Select a file from the explorer'));
      }

      function renderChanges(node, text, opts) {
        opts = opts || {};
        $('#changes-file').textContent = node.name;

        var meta = node.path + ' \u00b7 ' + fmtSize(node.size) + ' \u00b7 modified ' + fmtDate(node.lastModified);
        if (opts.capturedAt) meta += ' \u00b7 captured ' + fmtTime(opts.capturedAt);
        $('#changes-meta').textContent = meta;

        var badge = $('#changes-badge');
        if (opts.label) {
          badge.hidden = false;
          badge.textContent = opts.label;
          badge.className = 'changes-badge' + (opts.isLatest ? ' is-current' : '');
        } else {
          badge.hidden = true;
        }

        var body = $('#changes-body');
        body.innerHTML = '';

        if (looksBinary(text)) {
          body.appendChild(emptyState('fa-file', 'Binary file', 'Preview is not available for binary files.'));
          return;
        }

        var display = text;
        var truncated = !!opts.truncated;
        if (display.length > MAX_PREVIEW_BYTES) {
          display = display.slice(0, MAX_PREVIEW_BYTES);
          truncated = true;
        }

        var pre = el('pre', 'code-view');
        var code = el('code');
        var lines = display.split('\n');
        var frag = document.createDocumentFragment();

        for (var i = 0; i < lines.length; i++) {
          var line = el('div', 'code-line');
          line.appendChild(el('span', 'ln', String(i + 1)));
          line.appendChild(el('span', 'lc', lines[i]));
          frag.appendChild(line);
        }

        code.appendChild(frag);
        pre.appendChild(code);
        body.appendChild(pre);

        if (truncated) {
          body.appendChild(el('div', 'trunc-note',
            'Preview truncated at ' + fmtSize(MAX_PREVIEW_BYTES) + '.'));
        }
      }

      /* ------------------------------------------------------------------ *
       * Old Versions pane
       * ------------------------------------------------------------------ */

      function renderVersionsEmpty(msg) {
        var body = $('#versions-body');
        $('#versions-count').textContent = '';
        body.innerHTML = '';
        body.appendChild(emptyState('fa-clock-rotate-left', 'Old Versions', msg || 'Select a file from the explorer'));
      }

      function renderVersions() {
        var body = $('#versions-body');
        body.innerHTML = '';

        var versions = versionsFor(state.activePath);
        var count = $('#versions-count');

        if (!versions.length) {
          count.textContent = '';
          body.appendChild(emptyState(
            'fa-clock-rotate-left',
            'No versions yet',
            'Open a text file to capture its first version. Snapshots are stored in memory for this session.'
          ));
          return;
        }

        count.textContent = versions.length === 1 ? '1 version' : versions.length + ' versions';

        var ul = el('ul', 'ver-list');
        // Newest first.
        for (let i = versions.length - 1; i >= 0; i--) {
          const v = versions[i];
          const isLatest = i === versions.length - 1;

          var li = el('li', 'ver-item' + (i === state.activeIndex ? ' active' : '') + (isLatest ? ' current' : ''));

          var rail = el('div', 'ver-rail');
          rail.appendChild(el('span', 'ver-dot'));
          if (i > 0) rail.appendChild(el('span', 'ver-line'));
          li.appendChild(rail);

          var inner = el('div', 'ver-body');
          var title = el('div', 'ver-title');
          title.appendChild(el('span', null, 'Version ' + (i + 1)));
          if (isLatest) title.appendChild(el('span', 'ver-tag', 'Latest'));
          inner.appendChild(title);
          inner.appendChild(el('div', 'ver-meta', fmtDate(v.lastModified) + ' \u00b7 ' + fmtSize(v.size)));
          inner.appendChild(el('div', 'ver-meta',
            'captured ' + fmtTime(v.capturedAt) + (v.truncated ? ' \u00b7 partial' : '')));
          li.appendChild(inner);
          li.title = state.activePath + ' \u2014 version ' + (i + 1) + ' of ' + versions.length;

          li.addEventListener('click', function () {
            if (state.activeIndex !== i) showVersion(state.activePath, i);
          });

          ul.appendChild(li);
        }

        body.appendChild(ul);
      }

      /* ------------------------------------------------------------------ */

      async function selectFile(node, row) {
        var token = ++selectToken;

        var prev = document.querySelectorAll('.tree-row.file.selected');
        for (var i = 0; i < prev.length; i++) prev[i].classList.remove('selected');
        if (row) row.classList.add('selected');

        state.activePath = node.path;
        state.activeIndex = -1;
        renderChangesEmpty('Loading file contents\u2026');
        renderVersionsEmpty('Capturing version\u2026');

        try {
          var file = await readFile(node);
          if (token !== selectToken) return;
          var text = await file.text();
          if (token !== selectToken) return;

          var version = captureVersion(node, file, text);
          if (token !== selectToken) return;

          if (!version) {
            // Binary file: show contents, no versions.
            renderChanges({
              name: node.name,
              path: node.path,
              size: file.size,
              lastModified: file.lastModified
            }, text);
            renderVersionsEmpty('Versions are not tracked for binary files.');
            return;
          }

          showVersion(node.path, versionsFor(node.path).length - 1);
        } catch (err) {
          if (token !== selectToken) return;
          state.activePath = null;
          state.activeIndex = -1;
          renderChangesEmpty('Could not read this file.');
          renderVersionsEmpty('Could not read this file.');
        }
      }

      function setView(view) {
        var tabs = document.querySelectorAll('.nav-tab');
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.toggle('active', tabs[i].dataset.view === view);
        }
        var views = document.querySelectorAll('.view');
        for (var j = 0; j < views.length; j++) {
          views[j].hidden = views[j].dataset.view !== view;
        }
      }

      function init() {
        $('#btn-add-ws').addEventListener('click', addWorkspace);

        $('#btn-all-ws').addEventListener('click', function () {
          if (!state.workspaces.length) return;
          state.activeId = '__all__';
          state.activePath = null;
          state.activeIndex = -1;
          renderWorkspaces();
          renderExplorer();
          renderChangesEmpty('Select a file to view its contents');
          renderVersionsEmpty('Select a file to capture its versions');
        });

        $('#dir-input').addEventListener('change', function (e) {
          var files = Array.prototype.slice.call(e.target.files || []);
          if (!files.length) return;
          commitWorkspace(treeFromFiles(files));
        });

        document.addEventListener('keydown', function (e) {
          if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
            e.preventDefault();
            stepVersion(e.key === 'ArrowLeft' ? -1 : 1);
          }
        });

        var tabs = document.querySelectorAll('.nav-tab');
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].addEventListener('click', function (e) {
            e.preventDefault();
            setView(e.currentTarget.dataset.view);
          });
        }

        renderWorkspaces();
        renderExplorer();
        renderChangesEmpty('Add a workspace to get started');
        renderVersionsEmpty('Add a workspace to get started');
      }

      init();
    })();
  </script>
</body>
</html>
